<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service</title>
    <style>.services {
    text-align: center;
    padding: 60px 20px;
    background: #f5f5f5;
}

.services h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.services .subtitle {
    color: gray;
    margin-bottom: 40px;
}

.service-box {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.card {
    background: white;
    width: 250px;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    font-size: 14px;
    color: #555;
}

.card:hover {
    transform: translateY(-10px);
}

/* Responsive */
@media (max-width: 768px) {
    .card {
        width: 90%;
    }
}


    </style>
</head>
<body>
    <section class="services">
    <h2>Our Services</h2>
    <p class="subtitle">Experience the best with our premium services</p>

    <div class="service-box">
        <div class="card">
    <i class="fa-solid fa-rotate-left"></i>
    <img width="200px" height="250px" src="easy-returns-logo-trust-badges-easy-returns-icons-vector.jpg" alt="Easy Returns">
    <h3>Easy Returns</h3>
    <p>Hassle-free return policy for smooth experience.</p>
</div>

<div class="card">
    <i class="fa-solid fa-truck-fast"></i>
    <img width="200px" src="fast delivery.png" alt="Fast Delivery">
    <h3>Fast Delivery</h3>
    <p>Quick and reliable delivery at your doorstep.</p>
</div>

<div class="card">
    <i class="fa-solid fa-headset"></i>
    <img width="200px" src="download.png" alt="">
    <h3>24/7 Support</h3>
    <p>We are here to help you anytime.</p>
</div>

<div class="card">
    <i class="fa-solid fa-cart-shopping"></i>
    <img width="200px" src="online-shopping-icon-line-shopping-symbol-through-mobile-phone-isolated-on-white-background-vector.jpg" alt="">
    <h3>Online Shopping</h3>
    <p>Shop easily with secure payment options.</p>
</div>

    </div>
</section>

</body>
</html>
